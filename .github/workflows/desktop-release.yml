name: Release Desktop

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build and publish, for example v0.1.0
        required: true
        type: string

concurrency:
  group: release-desktop-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-desktop:
    name: Release Desktop (${{ matrix.bundle_name }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            electron_arch: x64
            bundle_name: Linux x64
            platform: linux
          - runner: macos-26
            target: aarch64-apple-darwin
            electron_arch: arm64
            bundle_name: Apple Silicon
            platform: macos
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            electron_arch: x64
            bundle_name: Intel
            platform: macos
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
      # Electron 44 ships Mach-O binaries with minos 13.0 (verified with
      # `otool -l` on the packaged Electron Framework), so the native addon
      # is built against the same floor. Inert on the Linux runner.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/native -> target

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches desktop version
        shell: bash
        run: |
          release_tag="$RELEASE_TAG"
          app_version="$(node -p "require('./apps/desktop/package.json').version")"
          tag_version="${release_tag#v}"

          if [[ ! "$release_tag" =~ ^v[0-9] ]]; then
            echo "Release tag must start with v and include a version number, got: $release_tag"
            exit 1
          fi

          if [[ -z "$app_version" ]]; then
            echo "Unable to determine desktop app version from apps/desktop/package.json"
            exit 1
          fi

          if [[ "$app_version" != "$tag_version" ]]; then
            echo "Release tag ${release_tag} does not match desktop app version ${app_version}"
            exit 1
          fi

      - name: Reconstruct App Store Connect API key
        if: matrix.platform == 'macos'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        shell: bash
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A -out "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          cert_path="$RUNNER_TEMP/apple-signing-cert.p12"
          keychain_path="$RUNNER_TEMP/codelegate-release.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$cert_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Resolve Apple signing identity
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/codelegate-release.keychain-db"
          cert_info="$(security find-identity -v -p codesigning "$keychain_path" | grep "Developer ID Application" | head -n 1)"

          if [[ -z "$cert_info" ]]; then
            echo "No Developer ID Application signing identity found in temporary keychain"
            security find-identity -v -p codesigning "$keychain_path" || true
            exit 1
          fi

          signing_identity="$(echo "$cert_info" | awk -F'"' '{print $2}')"

          if [[ -z "$signing_identity" ]]; then
            echo "Unable to extract signing identity from keychain entry"
            echo "$cert_info"
            exit 1
          fi

          # electron-builder prepends the certificate type itself, so CSC_NAME must be the name without the "Developer ID Application: " prefix.
          signing_identity="${signing_identity#Developer ID Application: }"

          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Test native addon
        run: pnpm --filter @codelegate/desktop native:test

      - name: Build native addon
        run: >-
          pnpm --filter @codelegate/desktop exec
          napi build --cwd native --release --platform --no-js --dts index.d.ts
          --target ${{ matrix.target }}

      - name: Verify native addon does not link Homebrew libraries
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          addon_path="$(find apps/desktop/native -maxdepth 1 -name 'codelegate-native.*.node' -print -quit)"

          if [[ -z "$addon_path" ]]; then
            echo "Unable to locate built native addon under apps/desktop/native"
            exit 1
          fi

          echo "Inspecting $addon_path"
          otool -L "$addon_path"

          if otool -L "$addon_path" | grep -q '/opt/homebrew/'; then
            echo "Native addon links against Homebrew libraries, which breaks signed distribution builds."
            exit 1
          fi

      - name: Test desktop
        run: pnpm --filter @codelegate/desktop test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build renderer, preload and main
        run: pnpm --filter @codelegate/desktop build

      - name: Package and sign macOS release
        if: matrix.platform == 'macos'
        env:
          CSC_NAME: ${{ env.APPLE_SIGNING_IDENTITY }}
          CSC_KEYCHAIN: ${{ runner.temp }}/codelegate-release.keychain-db
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          pnpm --filter @codelegate/desktop exec
          electron-builder --mac --${{ matrix.electron_arch }} --publish never

      - name: Package Linux release
        if: matrix.platform == 'linux'
        run: >-
          pnpm --filter @codelegate/desktop exec
          electron-builder --linux --${{ matrix.electron_arch }} --publish never

      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          app_path="$(find apps/desktop/release -maxdepth 2 -name 'Codelegate.app' -print -quit)"
          dmg_path="$(find apps/desktop/release -maxdepth 1 -name '*.dmg' -print -quit)"

          if [[ -z "$app_path" ]]; then
            echo "Unable to locate packaged Codelegate.app under apps/desktop/release"
            exit 1
          fi

          if [[ -z "$dmg_path" ]]; then
            echo "Unable to locate packaged DMG under apps/desktop/release"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl -a -vv -t exec "$app_path"
          # The notarization ticket is stapled to the .app by @electron/notarize
          # before the DMG is assembled around it. The DMG itself is never
          # submitted, so `stapler validate` on the disk image would always fail
          # with "does not have a ticket stapled to it".
          xcrun stapler validate "$app_path"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Codelegate ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          # One brace pattern, not one line per extension: each macOS job only
          # produces dmg/zip and the Linux job only AppImage/deb/rpm, and
          # fail_on_unmatched_files rejects any pattern that matches nothing.
          files: apps/desktop/release/*.{dmg,zip,AppImage,deb,rpm}

      - name: Cleanup signing files
        if: always() && matrix.platform == 'macos'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          rm -f "$RUNNER_TEMP/apple-signing-cert.p12"
          security delete-keychain "$RUNNER_TEMP/codelegate-release.keychain-db" || true
