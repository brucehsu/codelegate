[package]
name = "codelegate-native"
version = "1.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Rust N-API addon for Codelegate Desktop: PTY sessions and libgit2 diff/status."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = [
  "napi9",
  "serde-json",
  "dyn-symbols",
] }
napi-derive = "3"
# 0.21 changed `StatusEntry::path()` to return `Result` instead of `Option`,
# which `src/git.rs` (a verbatim move from the Tauri crate) does not compile
# against. Staying on 0.20 keeps that file untouched.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
# Process-group signalling for PTY teardown (`src/pty.rs`); already in the
# lockfile as a portable-pty dependency.
libc = "0.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[features]
noop = ["napi/noop"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
